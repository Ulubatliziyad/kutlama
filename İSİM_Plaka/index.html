            z-index: 9999;

    <script>
        // CONFIG'i sayfaya uygula
        (function () {
            document.title = CONFIG.title;
            document.getElementById('mainTitle').textContent = CONFIG.title;
            document.getElementById('myAudio').src = CONFIG.music;
            document.documentElement.style.setProperty('--box-img', "url('" + CONFIG.boxImage + "')");
            var v = document.getElementById('videoBtn');
            v.textContent = CONFIG.videoText; v.href = CONFIG.videoUrl;
            var c = document.getElementById('boxes');
            CONFIG.boxes.forEach(function (m) {

                d.className = 'box';
                d.addEventListener('click', function () { openBox(m); });

    <script>
        function welcomeConfetti() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.2 }, colors: ['#ff0000', '#8b0000', '#ffffff', '#000000'] });
        }
        // Açılışta pasta ekranı varsa konfeti o ekran kapanınca atılır
        window.onload = function() {
            if (!document.getElementById('cakeStage')) welcomeConfetti();
        };
        window.addEventListener('cake:closed', welcomeConfetti);

        function openBox(message) {
            var display = document.getElementById("message-display");
            display.classList.remove("show-message");
            void display.offsetWidth; 
            display.innerHTML = message;
            display.classList.add("show-message");
            confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 }, colors: ['#ff3333', '#ffffff', '#8b0000'] });
        }

        var myAudio = document.getElementById("myAudio");
        var isPlaying = false;

        function toggleMusic() {
            var btn = document.getElementById("play-btn");
            if (isPlaying) {
                myAudio.pause();
                btn.innerHTML = "▶ Müziği Başlat";
                isPlaying = false;
            } else {
                myAudio.play();
                btn.innerHTML = "⏸ Müziği Durdur";
                isPlaying = true;
                confetti({ particleCount: 50, spread: 60, colors: ['#ff3333', '#ffffff'] });
            }
        }

        // Başlık: harf harf yazılır (pasta ekranı kapanınca başlar)
        (function () {
            var h = document.querySelector('h1');
            h.setAttribute('aria-label', h.textContent.trim());
            h.innerHTML = h.textContent.trim().split(/\s+/).map(function (w) {
                return '<span class="word">' + w.split('').map(function (c) {
                    return '<span class="ch">' + c + '</span>';
                }).join('') + '</span>';
            }).join(' ');
            var chars = h.querySelectorAll('.ch'), started = false;
            function type() {
                if (started) return;
                started = true;
                var i = 0;
                var t = setInterval(function () {
                    if (i > 0) chars[i - 1].classList.remove('cur');
                    if (i >= chars.length) { clearInterval(t); return; }
                    chars[i].classList.add('on', 'cur');
                    i++;
                }, 80);
            }
            if (document.getElementById('cakeStage')) window.addEventListener('cake:closed', type);
            else type();
        })();

        // Müzik: mumlar sönünce (ya da "Geç"e basınca) otomatik başlasın
        function autoMusic() {
            if (isPlaying) return;
            myAudio.play().then(function () {
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = '⏸ Müziği Durdur';
            }).catch(function () { /* tarayıcı izin vermezse buton hâlâ duruyor */ });
        }
        window.addEventListener('cake:done', autoMusic);
        window.addEventListener('cake:closed', autoMusic);

        // iPhone için: ilk dokunuşta sesin kilidini aç
        document.getElementById('cakeStage').addEventListener('pointerdown', function () {
            myAudio.muted = true;
            myAudio.play().then(function () {
                myAudio.pause(); myAudio.currentTime = 0; myAudio.muted = false;
            }).catch(function () { myAudio.muted = false; });
        }, { once: true });
    </script>

    <script>
    /* Mum üfleme: mikrofona üfleyince mumlar söner, dokunarak da söndürülebilir */
    (() => {
        'use strict';

        const NAME = CONFIG.name;
        const SENS = 2.2;       // mikrofon hassasiyeti: büyütürsen daha kolay söner (ör. 3), küçültürsen zorlaşır (ör. 1)

        const W = 400, VIEW_Y = 90, VIEW_H = 460;   // pastanın mantıksal alanı ve kırpılan kısmı
        const FLAME_Y = 192;
        const cv = document.getElementById('cakeCanvas');
        const wrap = document.getElementById('cakeWrap');
        const ctx = cv.getContext('2d');
        const $ = id => document.getElementById(id);
        const stage = $('cakeStage'), skip = $('cakeSkip');
        const hint = $('cakeHint'), msg = $('cakeMsg'), micBtn = $('cakeMicBtn'),
              meterWrap = $('cakeMeterWrap'), meter = $('cakeMeter'), statusEl = $('cakeStatus');
        document.body.style.overflow = 'hidden'; // pasta ekranı açıkken sayfa kaymasın
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        $('cakeMsgTitle').textContent = 'İyi ki doğdunn ' + NAME + ' 🎂';

        function mulberry(a) {
            return () => {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rnd = mulberry(7);

        /* ---------- Pasta verisi (kırmızı-siyah tema) ---------- */
        const TIERS = [
            { x1: 60,  x2: 340, y1: 400, y2: 510, body: ['#a31212', '#5c0a0a'], cream: '#ffe9e6', ph: 0 },
            { x1: 100, x2: 300, y1: 310, y2: 400, body: ['#d32f2f', '#8a1c1c'], cream: '#fff1ef', ph: 1.7 },
            { x1: 140, x2: 260, y1: 240, y2: 310, body: ['#ff5252', '#c62828'], cream: '#fff7f6', ph: 3.1 },
        ];
        const SPR_COLORS = ['#ffffff', '#ffd54f', '#ffcdd2', '#ffab91', '#fff59d'];
        for (const t of TIERS) {
            t.sprinkles = [];
            const n = Math.round((t.x2 - t.x1) * (t.y2 - t.y1 - 54) / 260);
            for (let i = 0; i < n; i++) {
                t.sprinkles.push({
                    x: t.x1 + 8 + rnd() * (t.x2 - t.x1 - 16),
                    y: t.y1 + 46 + rnd() * (t.y2 - t.y1 - 58),
                    a: rnd() * Math.PI,
                    c: SPR_COLORS[(rnd() * SPR_COLORS.length) | 0],
                });
            }
        }
        const CHERRIES = [[78, 396], [322, 396], [120, 306], [280, 306]];
        const candles = [155, 177.5, 200, 222.5, 245].map((x, i) => ({ x, state: 'lit', out: 0, seed: i * 1.7 + 0.3 }));

        /* ---------- Ölçekleme ---------- */
        let dpr = 1, scale = 1;
        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 3);
            const cssW = Math.max(200, wrap.clientWidth);
            scale = cssW / W;
            cv.width = Math.round(cssW * dpr);
            cv.height = Math.round(cssW * VIEW_H / W * dpr);
        }
        window.addEventListener('resize', resize);
        if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
        resize();

        /* ---------- Çizim yardımcıları ---------- */
        function rr(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function drawPlate() {
            const g = ctx.createLinearGradient(25, 0, 375, 0);
            g.addColorStop(0, '#b8862b'); g.addColorStop(0.5, '#f6d77a'); g.addColorStop(1, '#b8862b');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.ellipse(200, 512, 176, 28, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.22)';
            ctx.beginPath(); ctx.ellipse(200, 508, 150, 20, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,.25)';
            ctx.beginPath(); ctx.ellipse(200, 510, 140, 10, 0, 0, Math.PI * 2); ctx.fill();
        }

        function drawTier(t) {
            const { x1, x2, y1, y2 } = t;
            const g = ctx.createLinearGradient(x1, 0, x2, 0);
            g.addColorStop(0, t.body[1]); g.addColorStop(0.3, t.body[0]);
            g.addColorStop(0.7, t.body[0]); g.addColorStop(1, t.body[1]);
            ctx.fillStyle = g;
            rr(x1, y1, x2 - x1, y2 - y1, 12); ctx.fill();

            ctx.save();
            rr(x1, y1, x2 - x1, y2 - y1, 12); ctx.clip();
            for (const s of t.sprinkles) {
                ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
                ctx.fillStyle = s.c; ctx.fillRect(-3, -1, 6, 2); ctx.restore();
            }
            // krema damlaları
            ctx.beginPath();
            ctx.moveTo(x1 - 2, y1 - 2); ctx.lineTo(x2 + 2, y1 - 2);
            for (let x = x2 + 2; x >= x1 - 2; x -= 2) {
                const a = 0.5 + 0.5 * Math.sin(x / 14 + t.ph);
                const b = 0.5 + 0.5 * Math.sin(x / 35 + t.ph * 2);
                ctx.lineTo(x, y1 + 14 + 22 * a * b);
            }
            ctx.closePath();
            ctx.fillStyle = t.cream; ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.restore();
        }

        function drawCherry(x, y) {
            ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.quadraticCurveTo(x + 2, y - 20, x + 10, y - 24); ctx.stroke();
            const g = ctx.createRadialGradient(x - 3, y - 4, 1, x, y, 10);
            g.addColorStop(0, '#ff7b7b'); g.addColorStop(1, '#8b0000');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
        }

        function drawCandleBodies() {
            for (const c of candles) {
                const x = c.x, top = 198, bot = 241;
                for (let y = top, k = 0; y < bot; y += 7, k++) {
                    ctx.fillStyle = k % 2 ? '#ff3333' : '#fff0f0';
                    ctx.fillRect(x - 4, y, 8, Math.min(7, bot - y));
                }
                ctx.strokeStyle = c.state === 'out' ? '#1c1c1c' : '#444'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(x, 198); ctx.lineTo(x, 192); ctx.stroke();
            }
        }

        function flamePath(x, by, w, h, lx) {
            ctx.beginPath(); ctx.moveTo(x, by);
            ctx.bezierCurveTo(x - w * 1.4, by - h * 0.25, x - w * 0.7 + lx * 0.3, by - h * 0.75, x + lx, by - h);
            ctx.bezierCurveTo(x + w * 0.7 + lx * 0.3, by - h * 0.75, x + w * 1.4, by - h * 0.25, x, by);
            ctx.closePath();
        }

        let time = 0;
        let sl = 0; // yumuşatılmış üfleme şiddeti (0..1)

        function drawFlame(c) {
            const k = 1 - c.out;
            if (k <= 0.01) return;
            const x = c.x, by = FLAME_Y;
            const flick = 1 + 0.10 * Math.sin(time * 13 + c.seed * 5) + 0.06 * Math.sin(time * 29 + c.seed * 3);
            const h = 27 * k * flick * (1 - 0.3 * sl);
            const w = 7.5 * k * (1 + 0.1 * Math.sin(time * 17 + c.seed));
            const lx = (sl * 12 + 1.2 * Math.sin(time * 9 + c.seed * 2) * (1 + sl * 3)) * k;

            // ışık hâlesi
            ctx.globalCompositeOperation = 'lighter';
            const r = 70 * k, gx = x + lx * 0.3, gy = by - h * 0.45;
            const gg = ctx.createRadialGradient(gx, gy, 2, gx, gy, r);
            gg.addColorStop(0, 'rgba(255,170,60,' + (0.38 * k) + ')');
            gg.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.fillStyle = gg; ctx.fillRect(gx - r, gy - r, r * 2, r * 2);
            ctx.globalCompositeOperation = 'source-over';

            const og = ctx.createLinearGradient(0, by, 0, by - h);
            og.addColorStop(0, '#ffd36b'); og.addColorStop(0.5, '#ff9a2e'); og.addColorStop(1, '#ff4d1a');
            ctx.fillStyle = og; flamePath(x, by, w, h, lx); ctx.fill();

            const ig = ctx.createLinearGradient(0, by, 0, by - h * 0.55);
            ig.addColorStop(0, '#fff4c2'); ig.addColorStop(1, '#ffe38a');
            ctx.fillStyle = ig; flamePath(x + lx * 0.15, by - 1, w * 0.5, h * 0.55, lx * 0.3); ctx.fill();
        }

        /* ---------- Duman ---------- */
        const smoke = [];
        function spawnSmoke(c) {
            for (let i = 0; i < 4; i++) {
                smoke.push({
                    x: c.x + (Math.random() - 0.5) * 3, y: FLAME_Y - 6, age: -Math.random() * 0.25,
                    life: 1.6 + Math.random() * 1.1, r0: 2 + Math.random() * 2, ph: Math.random() * 6,
                    vx: 4 + Math.random() * 10,
                });
            }
        }
        function updateSmoke(dt) {
            for (let i = smoke.length - 1; i >= 0; i--) {
                const s = smoke[i];
                s.age += dt;
                if (s.age <= 0) continue;
                s.y -= 34 * dt;
                s.x += (s.vx + 14 * Math.sin(s.age * 3 + s.ph)) * dt;
                if (s.age >= s.life) smoke.splice(i, 1);
            }
        }
        function drawSmoke() {
            for (const s of smoke) {
                if (s.age <= 0) continue;
                const u = s.age / s.life;
                ctx.fillStyle = 'rgba(205,205,222,' + (0.34 * (1 - u) * (1 - u)) + ')';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r0 + 9 * u, 0, Math.PI * 2); ctx.fill();
            }
        }

        /* ---------- Konfeti (sayfadaki canvas-confetti ile) ---------- */
        function fireConfetti() {
            if (typeof confetti !== 'function') return;
            const colors = ['#ff3333', '#8b0000', '#ffffff', '#ffd166'];
            const z = 10000; // pasta ekranının (z-index 9999) üstünde görünsün
            confetti({ particleCount: 110, angle: 60, spread: 70, origin: { x: 0, y: 0.85 }, colors: colors, zIndex: z });
            confetti({ particleCount: 110, angle: 120, spread: 70, origin: { x: 1, y: 0.85 }, colors: colors, zIndex: z });
            setTimeout(() => confetti({ particleCount: 80, spread: 100, origin: { y: 0.4 }, colors: colors, zIndex: z }), 350);
        }

        /* ---------- Mikrofon ---------- */
        let audio = null;

        async function enableMic() {
            micBtn.disabled = true; micBtn.textContent = 'Mikrofon açılıyor…';
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-mic-api');
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                });
                const AC = window.AudioContext || window.webkitAudioContext;
                const ac = new AC();
                if (ac.state === 'suspended') await ac.resume();
                const an = ac.createAnalyser();
                an.fftSize = 1024; an.smoothingTimeConstant = 0;
                ac.createMediaStreamSource(stream).connect(an); // hoparlöre bağlamıyoruz, geri besleme olmasın
                audio = { ac, an, stream, buf: new Uint8Array(an.fftSize), base: 0, n: 0, t: 0, ready: false };
                micBtn.style.display = 'none';
                meterWrap.style.display = 'block';
                hint.textContent = 'Dileğini tut, sonra mumlara üfle 💨';
                statusEl.textContent = 'Ortam sesi ayarlanıyor, bir saniye sessiz kal…';
            } catch (err) {
                micBtn.style.display = 'none';
                hint.textContent = 'Mikrofon açılamadı. Sorun değil, mumlara dokunarak söndürebilirsin 👆';
                statusEl.textContent = '';
            }
        }

        function stopMic() {
            if (!audio) return;
            try { audio.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
            try { audio.ac.close(); } catch (e) {}
            audio = null;
            meterWrap.style.display = 'none';
        }

        function micRead(dt) {
            const a = audio;
            a.an.getByteTimeDomainData(a.buf);
            let s = 0;
            for (let i = 0; i < a.buf.length; i++) { const v = (a.buf[i] - 128) / 128; s += v * v; }
            const rms = Math.sqrt(s / a.buf.length);
            if (!a.ready) {
                a.t += dt; a.base += rms; a.n++;
                if (a.t >= 0.7) {
                    a.base /= a.n; a.ready = true;
                    statusEl.textContent = 'Şimdi mikrofona yakından üfle! 💨';
                }
                return 0;
            }
            const lvl = clamp((rms - a.base - 0.025 / SENS) / (0.12 / SENS), 0, 1);
            if (lvl < 0.05) a.base += (rms - a.base) * Math.min(1, dt * 0.6); // ortam sesine yavaşça uyum
            return lvl;
        }

        /* ---------- Mum söndürme / bitiş ---------- */
        let accum = 0, finished = false, finTimer = 0;

        function extinguish(c) { if (c.state === 'lit') c.state = 'dying'; }

        cv.addEventListener('pointerdown', e => {
            if (finished) return;
            const r = cv.getBoundingClientRect();
            const lx = (e.clientX - r.left) / r.width * W;
            const ly = (e.clientY - r.top) / r.height * VIEW_H + VIEW_Y;
            if (ly < 140 || ly > 260) return;
            let best = null, bd = 26;
            for (const c of candles) {
                const d = Math.abs(lx - c.x);
                if (c.state === 'lit' && d < bd) { best = c; bd = d; }
            }
            if (best) extinguish(best);
        });

        // Pasta ekranını kapatır: önce pasta kaybolur, sonra karanlık perde açılıp site görünür
        let leaving = false;
        function leave(delay) {
            if (leaving) return;
            leaving = true;
            stopMic();
            setTimeout(() => {
                stage.classList.add('leaving');
                setTimeout(() => {
                    stage.remove();
                    document.body.style.overflow = '';
                    window.dispatchEvent(new CustomEvent('cake:closed'));
                }, 1900);
            }, delay);
        }

        function celebrate() {
            stopMic();
            statusEl.textContent = '';
            hint.style.display = 'none';
            micBtn.style.display = 'none';
            skip.style.display = 'none';
            msg.classList.add('show');
            fireConfetti();
            window.dispatchEvent(new CustomEvent('cake:done'));
            leave(3200);
        }

        micBtn.addEventListener('click', enableMic);
        skip.addEventListener('click', () => leave(0));

        /* ---------- Döngü ---------- */
        function update(dt) {
            time += dt;

            const target = (audio && !finished) ? micRead(dt) : 0;
            sl += (target - sl) * Math.min(1, dt * 12);
            if (audio) meter.style.width = (sl * 100).toFixed(0) + '%';

            if (audio && audio.ready && !finished) {
                if (sl > 0.2) {
                    accum += sl * dt;
                    const need = 0.12; // tam şiddette ~0.6 sn'de beş mum söner
                    while (accum >= need) {
                        accum -= need;
                        const lit = candles.filter(c => c.state === 'lit');
                        if (!lit.length) { accum = 0; break; }
                        extinguish(lit[(Math.random() * lit.length) | 0]);
                    }
                } else {
                    accum = Math.max(0, accum - dt * 0.3);
                }
            }

            for (const c of candles) {
                if (c.state === 'dying') {
                    c.out = Math.min(1, c.out + dt / 0.35);
                    if (c.out >= 1) { c.state = 'out'; spawnSmoke(c); }
                }
            }

            updateSmoke(dt);

            if (!finished && candles.every(c => c.state === 'out')) { finished = true; finTimer = 0.9; }
            if (finished && finTimer > 0) {
                finTimer -= dt;
                if (finTimer <= 0) celebrate();
            }
        }

        function draw() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, cv.width, cv.height);
            const k = dpr * scale;
            ctx.setTransform(k, 0, 0, k, 0, -VIEW_Y * k);

            drawPlate();
            for (const t of TIERS) drawTier(t);
            for (const [x, y] of CHERRIES) drawCherry(x, y);
            drawCandleBodies();

            // mumlar söndükçe pasta kararır (sadece pastanın pikselleri boyanır)
            const lit = candles.reduce((n, c) => n + (1 - c.out), 0) / candles.length;
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = 'rgba(8,2,12,' + (0.55 * (1 - lit)) + ')';
            ctx.fillRect(-200, -200, W + 400, 1200);
            ctx.globalCompositeOperation = 'source-over';

            for (const c of candles) drawFlame(c);
            drawSmoke();
        }

        let last = performance.now();
        function frame(now) {
            if (!stage.isConnected) return; // sahne kapandıysa döngüyü durdur
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            update(dt); draw();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    })();
    </script>

</body>
